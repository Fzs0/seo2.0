# A generic, single database configuration.

[alembic]
script_location = alembic

prepend_sys_path = .

version_path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname
# Note: real DATABASE_URL comes from .env (psycopg driver, with search_path=seo_agent
# appended by env.py). Do not set sqlalchemy.connect_args here (it requires a dict literal
# which alembic's configparser cannot parse).

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S