  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-size:14px}button,input,select{font:inherit}button{cursor:pointer}#app{display:flex;min-height:100vh;padding:12px;gap:0}.sidebar{width:212px;background:var(--nav);color:#fff;border-radius:20px;padding:20px 12px 14px;display:flex;flex-direction:column;flex:none}.brand{display:flex;align-items:center;gap:9px;padding:0 8px 24px;font-weight:700}.brand-mark{display:flex;gap:3px;align-items:flex-end;height:19px}.brand-mark i{width:5px;background:var(--gold);border-radius:3px}.brand-mark i:nth-child(1){height:9px}.brand-mark i:nth-child(2){height:14px}.brand-mark i:nth-child(3){height:19px}.nav{display:flex;flex-direction:column;gap:4px}.nav-label{font-size:11px;color:rgba(255,255,255,.4);padding:16px 14px 6px}.nav button{border:0;background:transparent;color:rgba(255,255,255,.68);padding:10px 13px;border-radius:12px;text-align:left;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:rgba(255,255,255,.1);color:#fff}.nav-icon{width:18px;text-align:center;color:var(--gold)}.main{min-width:0;flex:1;padding-left:26px}.topbar{height:60px;display:flex;align-items:center;gap:12px}.tabs{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;display:flex;gap:2px;flex-wrap:wrap}.tabs button{border:0;background:transparent;border-radius:999px;color:var(--muted);padding:8px 15px;font-size:12.5px}.tabs button:hover{background:rgba(23,22,20,.05);color:var(--ink)}.tabs button.active{background:var(--ink);color:#fff}.spacer{flex:1}.top-chip,.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--muted);font-size:12px}.icon-btn{width:38px;height:38px;padding:0;border-radius:50%;position:relative}.dot{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1px solid var(--card)}.content{max-width:1480px;padding:4px 0 28px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:12px 0 18px}.eyebrow{color:var(--muted);font-size:12px}.heading h1{font-size:29px;line-height:1.2;margin:4px 0 7px}.heading p{margin:0;color:var(--muted)}.heading-actions{display:flex;gap:8px;align-items:center}.select,.input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;color:var(--ink);outline:0}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:650}.btn-primary{background:var(--ink);color:#fff}.btn-ghost{background:var(--card);border:1px solid var(--line)}.btn-gold{background:var(--gold-soft);color:#7a5d12}.btn-danger{background:var(--pink-soft);color:#9d4a3e}.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.kpi{padding:16px 18px;border-radius:16px;min-height:123px;position:relative;overflow:hidden}.kpi.gold{background:var(--gold-soft)}.kpi.green{background:var(--green-soft)}.kpi.blue{background:var(--blue-soft)}.kpi.pink{background:var(--pink-soft)}.kpi-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.kpi-value{font-size:31px;font-weight:750;margin:13px 0 3px}.kpi-sub{font-size:11px;color:var(--muted)}.kpi-mark{position:absolute;right:19px;bottom:16px;font-size:25px;opacity:.45}.main-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(290px,.75fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.card-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;margin-bottom:14px}.card-title small{font-size:11px;font-weight:500;color:var(--muted)}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter{border:1px solid var(--line);background:var(--white);border-radius:9px;padding:7px 10px;color:var(--muted);font-size:12px}.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{text-align:left;background:var(--bg);color:var(--muted);font-size:11px;font-weight:650;padding:10px 11px;white-space:nowrap}.table td{padding:13px 11px;border-bottom:1px solid rgba(23,22,20,.07);vertical-align:middle}.table tr{cursor:pointer}.table tbody tr:hover td{background:rgba(232,185,79,.08)}.asset-name{font-weight:700}.asset-sub{font-size:11px;color:var(--muted);margin-top:3px}.tag{display:inline-block;border-radius:7px;padding:4px 8px;font-size:11px;font-weight:650;white-space:nowrap}.tag.gold{background:var(--gold-soft);color:#7a5d12}.tag.green{background:var(--green-soft);color:#4e6428}.tag.blue{background:var(--blue-soft);color:#3f6182}.tag.pink{background:var(--pink-soft);color:#a14a3c}.tag.purple{background:var(--purple-soft);color:#584c7a}.metric{font-weight:750}.muted{color:var(--muted);font-size:12px}.rail{display:flex;flex-direction:column;gap:14px}.loop{display:flex;flex-direction:column;gap:0}.loop-step{display:flex;gap:10px;position:relative;padding:0 0 16px}.loop-step:last-child{padding-bottom:0}.loop-step:not(:last-child)::after{content:"";position:absolute;left:12px;top:25px;bottom:0;border-left:1px dashed rgba(23,22,20,.2)}.loop-dot{width:25px;height:25px;border-radius:50%;background:var(--green-soft);color:#4e6428;display:grid;place-items:center;z-index:1;font-size:12px;flex:none}.loop-step.current .loop-dot{background:var(--gold);color:#5c4708}.loop-step.wait .loop-dot{background:var(--bg);color:var(--muted)}.loop-title{font-weight:700;font-size:12.5px}.loop-desc{font-size:11px;color:var(--muted);margin-top:3px}.bar{height:7px;background:rgba(23,22,20,.08);border-radius:99px;overflow:hidden;margin:13px 0 6px}.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--bg);border-radius:11px;padding:11px}.stat b{font-size:18px;display:block;margin-top:3px}.risk-list{display:flex;flex-direction:column;gap:10px}.risk{display:flex;gap:9px;align-items:flex-start}.risk-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--red);flex:none}.risk-dot.warn{background:var(--gold)}.risk-title{font-size:12px;font-weight:650}.risk-desc{font-size:11px;color:var(--muted);margin-top:2px}.view{display:none}.view.active{display:block}.section-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.asset-card{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer}.asset-card:hover{border-color:var(--gold)}.asset-card b{display:block;margin:6px 0}.asset-card small{color:var(--muted)}.asset-card .asset-meta{display:flex;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:11px}.queue{display:flex;flex-direction:column;gap:9px}.queue-row{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;align-items:center;gap:12px}.queue-row .queue-main{flex:1}.queue-row b{font-size:13px}.queue-row small{color:var(--muted);display:block;margin-top:3px}.queue-row .queue-end{text-align:right;min-width:95px}.queue-row .queue-end strong{display:block}.timeline{display:flex;flex-direction:column;gap:0}.event{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event-time{width:45px;color:var(--muted);font-size:11px}.event b{font-size:12px}.event p{margin:3px 0 0;color:var(--muted);font-size:11px}.drawer{position:fixed;inset:0;background:rgba(23,22,20,.18);display:none;justify-content:flex-end;z-index:10}.drawer.open{display:flex}.drawer-panel{height:100%;width:min(500px,92vw);background:var(--card);padding:24px;box-shadow:-14px 0 40px rgba(23,22,20,.12);overflow:auto}.drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.drawer h2{margin:5px 0 8px;font-size:22px}.drawer-section{border-top:1px solid var(--line);padding:16px 0}.drawer-section h3{font-size:12px;margin:0 0 8px}.drawer-section p{font-size:12px;color:var(--muted);line-height:1.65;margin:0}.drawer-actions{display:flex;gap:8px;margin-top:18px}.toast{position:fixed;right:25px;bottom:24px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 15px;display:none;z-index:20;box-shadow:0 8px 30px rgba(23,22,20,.2)}.toast.show{display:block}@media(max-width:1100px){.grid-kpi{grid-template-columns:repeat(2,1fr)}.main-grid,.section-grid{grid-template-columns:1fr}.asset-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><span>SEO Agent Workbench</span></div>
      <nav class="nav">
        <button class="active" data-nav="command"><span class="nav-icon">◈</span>总控台</button>
        <button data-nav="assets"><span class="nav-icon">▦</span>资产地图</button>
        <button data-nav="opportunities"><span class="nav-icon">⌕</span>机会引擎</button>
        <div class="nav-label">执行中心</div>
        <button data-nav="execution"><span class="nav-icon">↗</span>执行管线</button>
        <button data-nav="review"><span class="nav-icon">◌</span>数据复盘</button>
        <div class="nav-label">治理与知识</div>
        <button data-nav="risk"><span class="nav-icon">△</span>风险治理</button>
        <button data-nav="knowledge"><span class="nav-icon">▤</span>知识系统</button>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="tabs">
          <button class="active" data-view="command">总控</button>
          <button data-view="assets">资产集群</button>
          <button data-view="opportunities">机会队列</button>
          <button data-view="execution">执行队列</button>
          <button data-view="risk">风险治理</button>
          <button data-view="review">数据复盘</button>
        </div>
        <span class="spacer"></span><button class="icon-btn" id="notify" aria-label="通知">♢<i class="dot"></i></button><span class="top-chip" id="date"></span>
      </header>
      <div class="content">
        <section id="command" class="view active"></section>
        <section id="assets" class="view"></section>
        <section id="opportunities" class="view"></section>
        <section id="execution" class="view"></section>
        <section id="risk" class="view"></section>
        <section id="review" class="view"></section>
        <section id="knowledge" class="view"></section>
      </div>
    </main>
  </div>
  <div class="drawer" id="drawer"><aside class="drawer-panel"><div class="drawer-head"><div><div class="eyebrow">机会详情 · Agent 建议</div><h2 id="drawer-title">—</h2></div><button class="icon-btn" id="close-drawer">×</button></div><div id="drawer-body"></div></aside></div>
  <div class="toast" id="toast"></div>
  <script>
    const opportunities=[
      {id:1,type:'内容机会',tone:'gold',title:'补充“best mint disposable vape”评测指南',asset:'vapes1999.com · en-US',reason:'已有搜索需求，当前站点缺少覆盖购买决策的深度页面。',impact:'+4.8K 月曝光',score:'92',action:'生成 Brief'},
      {id:2,type:'技术修复',tone:'blue',title:'修复 36 个产品页缺少 meta description',asset:'exdivo.com · en-US',reason:'页面已有排名基础，但摘要缺失导致 CTR 低于同类页面。',impact:'+1.6% CTR',score:'87',action:'创建任务'},
      {id:3,type:'视觉 SEO',tone:'green',title:'为 128 张产品图补充语义化 alt',asset:'vapestest.de · de-DE',reason:'图片流量占比高，当前 alt 使用 SKU，无法表达搜索意图。',impact:'+620 点击',score:'84',action:'批量修复'},
      {id:4,type:'外链机会',tone:'purple',title:'评估 12 个高相关评测站外链',asset:'topvapes.de · de-DE',reason:'内容质量达到阈值，但核心页面链接权重不足。',impact:'+18 个引用域',score:'78',action:'进入评估'},
      {id:5,type:'内容机会',tone:'pink',title:'合并 4 篇相似的 vape flavors 页面',asset:'vape2026.de · de-DE',reason:'主题重叠，存在关键词互相竞争和重复内容风险。',impact:'降低 Cannibalization',score:'76',action:'查看方案'}
    ];
    const assets=[
      ['exdivo.com','商业主站','en-US','内容 + 技术','正常','gold','412 页面'],['exdivo.club','独立站','en-US','技术 + 转化','正常','green','86 页面'],['vapes1999.com','博客站','en-US','内容集群','运行中','blue','1,284 页面'],['vapestest.de','博客站','de-DE','内容 + 视觉','运行中','blue','623 页面'],['vape2026.de','博客站','de-DE','内容集群','待决策','gold','304 页面'],['topvapes.de','评测站','de-DE','内容 + 外链','有风险','pink','218 页面'],['vapetopline.com','独立站','en-US','产品页优化','正常','green','96 页面'],['vapes2000.com','独立站','en-US','技术 SEO','正常','green','74 页面']
    ];
    const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const today=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());document.getElementById('date').textContent=today;
    function header(kicker,title,desc,actions=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="heading-actions">${actions}</div></div>`}
    function kpis(){return `<div class="grid-kpi"><div class="kpi gold"><div class="kpi-head">管理资产 <span>↗</span></div><div class="kpi-value">1,248</div><div class="kpi-sub">站点、页面、关键词与连接</div><div class="kpi-mark">▦</div></div><div class="kpi pink"><div class="kpi-head">待处理机会 <span>!</span></div><div class="kpi-value">326</div><div class="kpi-sub">其中 42 个高优先级</div><div class="kpi-mark">✦</div></div><div class="kpi green"><div class="kpi-head">执行中任务 <span>↗</span></div><div class="kpi-value">84</div><div class="kpi-sub">本周已完成 216 个动作</div><div class="kpi-mark">◌</div></div><div class="kpi blue"><div class="kpi-head">风险待确认 <span>△</span></div><div class="kpi-value">17</div><div class="kpi-sub">3 个需要立即处理</div><div class="kpi-mark">!</div></div></div>`}
    function opportunityTable(items=opportunities.slice(0,4)){return `<div class="table-wrap"><table class="table"><thead><tr><th>机会</th><th>资产范围</th><th>AI 依据</th><th>预期影响</th><th>置信度</th><th></th></tr></thead><tbody>${items.map(o=>`<tr data-opp="${o.id}"><td><span class="tag ${o.tone}">${o.type}</span><div class="asset-name" style="margin-top:7px">${o.title}</div></td><td><span class="muted">${o.asset}</span></td><td><span class="muted">${o.reason}</span></td><td class="metric">${o.impact}</td><td><span class="tag green">${o.score}%</span></td><td><button class="btn btn-ghost" data-opp="${o.id}">${o.action}</button></td></tr>`).join('')}</tbody></table></div>`}
    function loop(){return `<div class="card"><div class="card-title"><span>Agent 当前循环</span><small>运行策略：半自动确认</small></div><div class="loop"><div class="loop-step"><span class="loop-dot">✓</span><div><div class="loop-title">读取资产与历史数据</div><div class="loop-desc">1,248 个资产 · 最近同步 8 分钟前</div></div></div><div class="loop-step"><span class="loop-dot">✓</span><div><div class="loop-title">发现并排序机会</div><div class="loop-desc">已识别 326 个机会，42 个 P0/P1</div></div></div><div class="loop-step current"><span class="loop-dot">●</span><div><div class="loop-title">等待高风险动作确认</div><div class="loop-desc">3 个动作可能影响站点结构或外链</div></div></div><div class="loop-step wait"><span class="loop-dot">4</span><div><div class="loop-title">执行与效果复盘</div><div class="loop-desc">动作上线后自动追踪 7 / 14 / 28 天</div></div></div></div><div class="bar"><i style="width:68%"></i></div><div class="muted">本轮决策进度 68% · 下一次扫描 24 分钟后</div></div>`}
    function command(){document.getElementById('command').innerHTML=header('SEO AGENT · COMMAND CENTER','全局增长控制台','Agent 正在从资产、机会和历史结果中生成下一批可执行决策。',`<select class="select"><option>全部资产</option><option>博客站群</option><option>独立站</option><option>de-DE 市场</option></select><button class="btn btn-primary" data-toast="已开始重新扫描全部资产">重新扫描</button>`)+kpis()+`<div class="main-grid"><div class="card"><div class="card-title"><span>优先机会队列</span><button class="btn btn-ghost" data-view="opportunities">查看全部 →</button></div><div class="filter-row"><button class="filter active">全部 326</button><button class="filter">内容 118</button><button class="filter">技术 94</button><button class="filter">视觉 62</button><button class="filter">外链 52</button></div>${opportunityTable()}</div><div class="rail">${loop()}<div class="card"><div class="card-title"><span>需要人工判断</span><span class="tag pink">3 项</span></div><div class="risk-list"><div class="risk"><i class="risk-dot"></i><div><div class="risk-title">是否为 topvapes.de 建设外链</div><div class="risk-desc">涉及外部站点与预算，需要确认策略。</div></div></div><div class="risk"><i class="risk-dot warn"></i><div><div class="risk-title">vape2026.de 是否启用博客集群</div><div class="risk-desc">Agent 判断内容机会大于技术机会。</div></div></div><div class="risk"><i class="risk-dot warn"></i><div><div class="risk-title">合并相似页面前检查转化损失</div><div class="risk-desc">需要保留历史 URL 和内部链接。</div></div></div></div><button class="btn btn-ghost" style="width:100%;margin-top:14px" data-view="risk">进入风险治理</button></div></div></div>`}
    function assetsView(){document.getElementById('assets').innerHTML=header('ASSET MAP · 资产地图','资产集群','按行业、市场、语种、站点角色和自动化策略组织资产；一个站点可以同时属于多个集群。',`<input class="input" placeholder="搜索域名、市场或标签" id="asset-search"><button class="btn btn-primary" data-toast="资产导入入口将在此处接入">导入资产</button>`)+`<div class="card"><div class="card-title"><span>资产总览 <small>1,248 个资产 · 8 个站点</small></span><div class="filter-row" style="margin:0"><button class="filter active">全部</button><button class="filter">内容型</button><button class="filter">技术型</button><button class="filter">视觉型</button></div></div><div class="asset-grid" id="asset-grid">${assets.map((a,i)=>`<div class="asset-card" data-asset="${i}"><span class="tag ${a[5]}">${a[4]}</span><b>${a[0]}</b><small>${a[1]} · ${a[2]}</small><div class="asset-meta"><span>${a[3]}</span><strong>${a[6]}</strong></div></div>`).join('')}</div></div><div class="section-grid" style="margin-top:14px"><div class="card"><div class="card-title"><span>集群视角</span><small>可重叠归类</small></div><div class="queue"><div class="queue-row"><span class="tag gold">市场</span><div class="queue-main"><b>北美 · en-US</b><small>4 个站点 · 718 页面 · 以内容和转化为主</small></div><div class="queue-end"><strong>718</strong><small>资产</small></div></div><div class="queue-row"><span class="tag blue">市场</span><div class="queue-main"><b>德国 · de-DE</b><small>4 个站点 · 1,145 页面 · 内容、视觉与外链并行</small></div><div class="queue-end"><strong>1,145</strong><small>资产</small></div></div><div class="queue-row"><span class="tag green">角色</span><div class="queue-main"><b>产品型独立站</b><small>不默认建设博客，优先检查页面、图片与转化路径</small></div><div class="queue-end"><strong>4</strong><small>站点</small></div></div></div></div><div class="card"><div class="card-title"><span>Agent 归类依据</span><span>✦</span></div><p class="muted" style="line-height:1.7;margin:0">归类不是固定业务线。Agent 会结合站点角色、产品类型、市场、现有内容、SERP 形态和历史效果动态决定：</p><div class="tag gold" style="margin-top:13px">内容集群</div> <div class="tag green">技术优化</div> <div class="tag blue">视觉 SEO</div> <div class="tag purple">外链评估</div></div></div>`}

    function showView(id){if(!renders[id])return;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===id));document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===id));document.querySelectorAll('.nav button').forEach(el=>el.classList.toggle('active',el.dataset.nav===id));if(document.getElementById(id).innerHTML==='')renders[id]();window.scrollTo({top:0,behavior:'smooth'})}
    document.addEventListener('click',e=>{const view=e.target.closest('[data-view]')?.dataset.view||e.target.closest('[data-nav]')?.dataset.nav;if(view)showView(view);const toast=e.target.closest('[data-toast]')?.dataset.toast;if(toast){const t=document.getElementById('toast');t.textContent=toast;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}const opp=e.target.closest('[data-opp]')?.dataset.opp;if(opp)openOpp(Number(opp))});
    function openOpp(id){const o=opportunities.find(x=>x.id===id);if(!o)return;document.getElementById('drawer-title').textContent=o.title;document.getElementById('drawer-body').innerHTML=`<span class="tag ${o.tone}">${o.type}</span><div class="drawer-section"><h3>作用资产</h3><p>${o.asset}</p></div><div class="drawer-section"><h3>Agent 为什么提出这个机会</h3><p>${o.reason} 当前预计影响为 <b>${o.impact}</b>，综合置信度 <b>${o.score}%</b>。</p></div><div class="drawer-section"><h3>建议执行链路</h3><p>读取现有页面与关键词 → 获取真实 SERP → 生成策略 Brief → 生成执行任务 → 上线后追踪曝光、点击、CTR、排名和转化。</p></div><div class="drawer-section"><h3>决策边界</h3><p>${o.type==='外链机会'?'涉及外部站点，不自动采购或发布，需要人工确认。':'低风险动作可进入执行队列；内容和页面变更会保留版本记录。'}</p></div><div class="drawer-actions"><button class="btn btn-primary" data-toast="已批准，动作进入执行队列" id="approve">批准执行</button><button class="btn btn-ghost" data-toast="已加入观察列表">稍后处理</button></div>`;document.getElementById('drawer').classList.add('open')}
    document.getElementById('close-drawer').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};document.getElementById('notify').onclick=()=>{const t=document.getElementById('toast');t.textContent='3 个 Agent 事件待查看';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
