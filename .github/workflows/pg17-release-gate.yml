name: PostgreSQL 17 release gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pg17-release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seo
          POSTGRES_PASSWORD: seo_test
          POSTGRES_DB: seo_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seo -d seo_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SEO_PG17_TEST_DSN: postgresql://seo:seo_test@127.0.0.1:5432/seo_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: PostgreSQL 17 acceptance
        shell: pwsh
        run: ./scripts/test-pg17-release-gate.ps1
